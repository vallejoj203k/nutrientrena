name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-verify:
    name: Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check app/ --select E,F,W --ignore E501,F401

      - name: Verify all models import cleanly
        env:
          DATABASE_URL: "sqlite:///./ci_check.db"
          SECRET_KEY: ci-secret-key
        run: |
          python -c "
          import app.models
          from app.database import Base
          tables = list(Base.metadata.tables.keys())
          print(f'✅ {len(tables)} tablas registradas')
          assert len(tables) >= 33, f'Expected at least 33 tables, got {len(tables)}'
          "

      - name: Verify app loads all routes
        env:
          DATABASE_URL: "sqlite:///./ci_check.db"
          SECRET_KEY: ci-secret-key
        run: |
          python -c "
          from app.main import app
          routes = [r for r in app.routes if hasattr(r, 'path')]
          print(f'✅ {len(routes)} rutas registradas')
          assert len(routes) >= 50, f'Expected at least 50 routes, got {len(routes)}'
          "

      - name: Verify migration file exists
        run: |
          python -c "
          import glob
          files = glob.glob('alembic/versions/*.py')
          assert len(files) >= 1, 'No migration files found'
          print(f'✅ {len(files)} migracion(es) encontrada(s)')
          "

  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    needs: lint-and-verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///./test_nutrientrena.db"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_BUCKET: "test-bucket"
          RESEND_API_KEY: "test"
        run: |
          pytest tests/ --tb=short -q \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  frontend:
    name: Frontend (Chromium)
    runs-on: ubuntu-latest
    needs: lint-and-verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # package.json vive en tests/, NO en la raíz: en la raíz haría que
      # Nixpacks tome el proyecto por Node en el despliegue y deje de instalar
      # las dependencias de Python.
      - name: Install Playwright + Chromium
        run: |
          npm --prefix tests ci || npm --prefix tests install
          npx --prefix tests playwright install --with-deps chromium

      # Los bancos de prueba se generan extrayendo el código REAL de las
      # páginas y del módulo compartido, no una copia: si alguien mueve una
      # función y el extractor deja de encontrarla, esto falla aquí y no en
      # producción.
      - name: Generar bancos de prueba
        run: python3 tests/frontend/generar_harness.py

      - name: Suites de frontend
        run: |
          fallos=0
          for t in tests/frontend/*.test.js; do
            echo "── $t"
            node "$t" || fallos=1
          done
          exit $fallos

  migrations:
    name: Migraciones sobre MySQL limpio
    runs-on: ubuntu-latest
    needs: lint-and-verify

    # Este job existe por un fallo real: user_pathologies tenía una clave
    # foránea a una tabla creada en la OTRA rama del historial, así que
    # `alembic upgrade heads` no levantaba una base nueva. No se veía en las
    # bases ya migradas, y los tests usan create_all (no alembic), así que
    # nada lo detectaba.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nutri_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrar desde cero, igual que start.sh
        env:
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/nutri_ci"
          SECRET_KEY: ci-secret-key
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_BUCKET: test-bucket
          RESEND_API_KEY: test
        run: alembic upgrade heads

      - name: Sembrar datos iniciales
        env:
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/nutri_ci"
          SECRET_KEY: ci-secret-key
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_BUCKET: test-bucket
          RESEND_API_KEY: test
        run: python -m app.seeds.run_seeds

      # El modelo y la base pueden divergir sin que nadie se entere: los tests
      # crean las tablas desde el modelo, no desde las migraciones.
      - name: Comprobar que el modelo cuadra con lo migrado
        env:
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/nutri_ci"
          SECRET_KEY: ci-secret-key
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_BUCKET: test-bucket
          RESEND_API_KEY: test
        run: |
          python -c "
          import app.models  # noqa
          from sqlalchemy import create_engine, inspect
          from app.config import SQLALCHEMY_DATABASE_URL
          from app.database import Base
          insp = inspect(create_engine(SQLALCHEMY_DATABASE_URL))
          reales = set(insp.get_table_names())
          faltan = [t for t in Base.metadata.tables if t not in reales]
          assert not faltan, f'Tablas del modelo que las migraciones no crean: {faltan}'
          print(f'✅ {len(reales)} tablas migradas, ninguna del modelo sin migrar')
          "

  build-deploy:
    name: El despliegue se construye como Python
    runs-on: ubuntu-latest
    needs: lint-and-verify

    # Existe por una caída real: un package.json en la raíz hizo que Nixpacks
    # —quien construye en Railway— tomara el proyecto por Node, no instalara
    # requirements.txt y el arranque fallara con "alembic: command not found".
    # CI estaba en verde porque sus jobs instalan las dependencias a mano, así
    # que la detección de Nixpacks no se ejercitaba en ningún sitio.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Comprobación determinista y sin dependencias. Es la que corta.
      - name: La raíz debe indicar Python
        run: python3 scripts/verificar_build.py

      # Segunda capa: preguntarle a Nixpacks de verdad. Cubre cambios de
      # detección que la lista de arriba no prevea.
      #
      # Solo falla ante una señal CONFIRMADA: si no se puede instalar Nixpacks
      # o cambia el formato de salida, se avisa y se sigue. Un job que se cae
      # porque no ha podido comprobar nada solo genera ruido, y el paso
      # anterior ya cubre el caso conocido.
      - name: Preguntarle a Nixpacks qué lenguaje detecta
        run: |
          if ! curl -sSL --max-time 60 https://nixpacks.com/install.sh | bash; then
            echo "::warning::No se pudo instalar Nixpacks; se omite esta comprobación."
            exit 0
          fi
          plan=$(nixpacks plan . 2>/dev/null) || {
            echo "::warning::nixpacks plan no devolvió nada; se omite."
            exit 0
          }
          echo "$plan"
          if ! echo "$plan" | grep -qi "python\|pip"; then
            echo "::error::Nixpacks NO detecta Python. El despliegue arrancaría sin alembic ni uvicorn."
            exit 1
          fi
          echo "Nixpacks detecta Python."
