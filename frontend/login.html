<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <title>ALZUM.io — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── Panel izquierdo ── */
    .left {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .left img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ── Panel derecho ── */
    .right {
      width: clamp(360px, 38vw, 520px);
      flex-shrink: 0;
      height: 100%;
      background: #F3F4F6;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: clamp(20px, 4vh, 48px) clamp(18px, 3vw, 48px);
    }

    .form-box {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.2vh, 20px);
      margin: auto; /* centers vertically, but allows scroll on short screens */
    }

    /* Logo */
    .logo-banner {
      background: #4F46E5;
      border-radius: 10px;
      padding: 18px 24px;
      text-align: center;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-style: italic;
    }
    .logo-text span {
      color: #818CF8;
    }

    /* Inputs */
    .input-group {
      position: relative;
    }
    .input-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      pointer-events: none;
    }
    .input-group input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: #111827;
      outline: none;
      transition: border-color .2s;
    }
    .input-group input::placeholder { color: #9CA3AF; }
    .input-group input:focus { border-color: #4F46E5; }

    /* Botón login */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .2s, transform .1s;
      letter-spacing: .5px;
    }
    .btn-login:hover   { background: #4338CA; }
    .btn-login:active  { transform: scale(.98); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Link recuperar */
    .forgot {
      text-align: center;
      font-size: 13px;
      color: #6B7280;
    }
    .forgot a {
      color: #4F46E5;
      text-decoration: none;
      font-weight: 500;
    }
    .forgot a:hover { text-decoration: underline; }

    /* "Soy invitado": quien acaba de ser dado de alta y todavía no tiene
       contraseña. Va debajo del login, discreto: es un camino de una sola vez
       y no debe competir con el acceso normal. */
    .invitado-link {
      text-align: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(148,163,184,.25);
      font-size: 13px;
      color: #6B7280;
    }
    .invitado-link button {
      background: none; border: none; padding: 0; cursor: pointer;
      color: #4F46E5; font: inherit; font-weight: 600;
    }
    .invitado-link button:hover { text-decoration: underline; }
    #invitadoPanel { display: none; margin-top: 16px; }
    #invitadoPanel .ayuda {
      font-size: 12.5px; color: #6B7280; line-height: 1.55;
      background: #F8F9FB; border: 1px solid #E5E7EB;
      border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    }
    #invitadoPanel .input-group { margin-bottom: 12px; }
    #invitadoPanel input { text-transform: none; }
    #invCodigo { text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

    /* Error */
    .error-msg {
      background: #FEE2E2;
      border: 1px solid #FECACA;
      color: #DC2626;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 14px;
      display: none;
    }

    /* Success */
    .success-msg {
      background: #DCFCE7;
      border: 1px solid #BBF7D0;
      color: #16A34A;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 14px;
      display: none;
    }

    /* Responsive */
    @media (max-width: 820px) {
      .left { display: none; }
      .right { width: 100%; }
      .form-box { max-width: 420px; }
    }
    @media (max-height: 560px) {
      .logo-banner { padding: 12px 20px; }
      .logo-text { font-size: 24px; }
      .input-group input { padding: 11px 12px 11px 42px; }
      .btn-login { padding: 12px; }
    }
    @media (max-width: 400px) {
      .right { padding: 24px 16px; }
      .logo-text { font-size: 26px; }
      .input-group input { font-size: 16px; } /* prevent iOS zoom */
      .btn-login { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- Panel izquierdo -->
  <div class="left">
    <img src="panel_login.jpg" alt="ALZUM.io" />
  </div>

  <!-- Panel derecho -->
  <div class="right">
    <div class="form-box">

      <div class="logo-banner">
        <div class="logo-text">ALZUM<span>.io</span></div>
      </div>

      <div class="error-msg"   id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <div class="input-group">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input id="emailInput" type="email" placeholder="usuario" autocomplete="email" />
      </div>

      <div class="input-group">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="passInput" type="password" placeholder="password" autocomplete="current-password" />
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span id="btnText">Login</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="forgot">
        <a href="#" onclick="doRecover(); return false;">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="invitado-link" id="invitadoEnlace">
        ¿Te han invitado y aún no tienes contraseña?
        <button type="button" onclick="abrirInvitado()">Soy invitado</button>
      </div>

      <div id="invitadoPanel">
        <div class="ayuda">
          Escribe el correo con el que te invitaron y el <b>código</b> que te pasaron,
          y crea tu contraseña. Después entrarás con normalidad.
        </div>
        <div class="input-group">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input id="invEmail" type="email" placeholder="tu correo" autocomplete="email" />
        </div>
        <div class="input-group">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="invCodigo" type="text" placeholder="código de invitación" autocomplete="off" />
        </div>
        <div class="input-group">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="invClave" type="password" placeholder="crea tu contraseña" autocomplete="new-password" />
        </div>
        <div class="input-group">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <input id="invClave2" type="password" placeholder="repite la contraseña" autocomplete="new-password" />
        </div>
        <button class="btn-login" id="invBtn" onclick="crearClaveInvitado()">
          <span>Crear contraseña y entrar</span>
        </button>
        <div class="forgot" style="margin-top:12px;">
          <a href="#" onclick="cerrarInvitado(); return false;">Volver al acceso normal</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API = 'https://nutrientrena-production.up.railway.app';

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function setLoading(val) {
      const btn  = document.getElementById('loginBtn');
      const txt  = document.getElementById('btnText');
      const spin = document.getElementById('spinner');
      btn.disabled    = val;
      txt.style.display  = val ? 'none' : 'inline';
      spin.style.display = val ? 'block' : 'none';
    }

    async function doLogin() {
      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;

      if (!email || !password) {
        showError('Por favor completa todos los campos.');
        return;
      }

      setLoading(true);
      document.getElementById('errorMsg').style.display   = 'none';
      document.getElementById('successMsg').style.display = 'none';

      try {
        const res  = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          showError(data.message || 'Credenciales incorrectas.');
          return;
        }

        localStorage.setItem('token',         data.data.token);
        localStorage.setItem('refresh_token', data.data.refresh_token);

        // Fetch role to adapt sidebar on all pages
        let roleId = 0;
        try {
          const me = await fetch(`${API}/api/auth/me`, { headers: { Authorization: `Bearer ${data.data.token}` } });
          const mj = await me.json();
          const md = mj.data || mj;
          roleId = md.roles?.[0]?.id || 0;
          localStorage.setItem('role_id', roleId);
        } catch {}

        showSuccess('¡Bienvenido! Redirigiendo...');
        // El cliente (rol 6) va a su zona; el resto al panel del coach.
        const dest = String(roleId) === '6' ? 'client-home.html' : 'dashboard.html';
        setTimeout(() => {
          window.location.href = dest;
        }, 800);

      } catch (e) {
        showError('Error de conexión. Verifica tu internet.');
      } finally {
        setLoading(false);
      }
    }

    async function doRecover() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) {
        showError('Escribe tu email primero.');
        return;
      }
      try {
        const res  = await fetch(`${API}/api/auth/recover-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        showSuccess(data.message || 'Correo enviado. Revisa tu bandeja de entrada.');
      } catch {
        showError('Error al enviar el correo.');
      }
    }

    /* ── "Soy invitado" ─────────────────────────────────────────────────
       Quien acaba de ser dado de alta pone su correo, el código que le
       pasaron y crea su contraseña. Después entra como todo el mundo.

       El código hace falta además del correo: sin él, cualquiera que conozca
       —o adivine— el correo de un invitado podría reclamar la cuenta antes
       que su dueño, y aquí se reparten cuentas de super-admin. */
    function abrirInvitado() {
      document.getElementById('invitadoPanel').style.display = 'block';
      document.getElementById('invitadoEnlace').style.display = 'none';
      // Se arrastra lo que ya hubiera escrito arriba: es el mismo correo.
      const arriba = document.getElementById('emailInput').value.trim();
      if (arriba) document.getElementById('invEmail').value = arriba;
      document.getElementById('invEmail').focus();
    }

    function cerrarInvitado() {
      document.getElementById('invitadoPanel').style.display = 'none';
      document.getElementById('invitadoEnlace').style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
    }

    function invitadoAbierto() {
      return document.getElementById('invitadoPanel').style.display === 'block';
    }

    async function crearClaveInvitado() {
      const email  = document.getElementById('invEmail').value.trim();
      const code   = document.getElementById('invCodigo').value.trim();
      const clave  = document.getElementById('invClave').value;
      const clave2 = document.getElementById('invClave2').value;

      if (!email || !code) { showError('Hacen falta tu correo y el código.'); return; }
      if (clave.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }
      // Se pide dos veces porque nadie más la conoce: una errata aquí deja la
      // cuenta bloqueada hasta pedir otro código.
      if (clave !== clave2) { showError('Las dos contraseñas no coinciden.'); return; }

      const btn = document.getElementById('invBtn');
      btn.disabled = true;
      try {
        const res = await fetch(`${API}/api/auth/accept-invitation`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, password: clave }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) {
          showError(data.message || 'No se pudo crear la contraseña.');
          return;
        }
        // Se entra solo: pedirle que la escriba otra vez recién creada es
        // hacerle repetir lo que acaba de hacer.
        showSuccess('Contraseña creada. Entrando…');
        document.getElementById('emailInput').value = email;
        document.getElementById('passInput').value = clave;
        cerrarInvitado();
        doLogin();
      } catch {
        showError('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false;
      }
    }

    // Enter: en el panel de invitado envía ESE formulario, no el de acceso.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (invitadoAbierto()) crearClaveInvitado(); else doLogin();
    });
  </script>
</body>
</html>
